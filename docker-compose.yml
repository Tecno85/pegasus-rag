services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8501"
    volumes:
      - rag_raw:/app/data/raw
      - rag_index:/app/data/index
      - model_cache:/home/pegasus/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  rag_raw:
  rag_index:
  model_cache:
